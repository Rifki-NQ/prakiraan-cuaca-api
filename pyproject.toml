    { name = "Rifki-NQ", email = "rifqinf950@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiolimiter>=1.3.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
