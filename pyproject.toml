[project]
name = "prakiraan-cuaca-api"
version = "0.1.0"
description = "A weather forecast API"
readme = "README.md"
authors = [
    { name = "Rifki-NQ", email = "rifqinf950@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    # cap the fastapi version to <0.137.0
    # because slowapi global rate limiting with routers
    # does not work on fastapi version >= 0.137.0
    # see https://github.com/laurentS/slowapi/issues/281
    "fastapi[standard]<0.137.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
run_api = "prakiraan_cuaca_api.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "prakiraan_cuaca_api.main:app"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: mark test as integration test",
    "prod_db: hits the production database directly (reads/creates tables, never drops)"
]
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
mypy_path = "src"
strict = true

[tool.pyright]
typeCheckingMode = "strict"
reportPrivateUsage = false
